packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - scripts

# pnpm 10.33 reads both allowBuilds and onlyBuiltDependencies and merges them, so they cannot
# disagree; allowBuilds is the key pnpm writes and documents, so the list lives here only.
allowBuilds:
  '@swc/core': true
  core-js: true
  esbuild: true
  msw: true
  unrs-resolver: true

autoInstallPeers: false

catalog:
  '@tailwindcss/vite': ^4.3.3
  '@tanstack/react-query': ^5.104.5
  '@types/node': ^25.9.9
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^5.2.0
  class-variance-authority: ^0.7.1
  clsx: 2.1.1
  drizzle-orm: ^0.45.4
  framer-motion: 12.43.0
  lucide-react: ^0.577.0
  react: 19.3.1
  react-dom: 19.3.1
  tailwind-merge: 3.7.0
  tailwindcss: ^4.3.3
  tsx: ^4.23.15
  vite: ^7.3.5
  zod: ^3.25.76

fetchRetries: 8

fetchTimeout: 900000

minimumReleaseAge: 1440

overrides:
  # Security advisories in transitive dependencies (pnpm audit --prod, 2026-09-30). Each is pinned to the
  # patched line within its own major, so nothing here moves a package across a breaking version.
  'path-to-regexp@^8': '^8.4.0'
  'qs@^6': '^6.16.0'
  'fast-uri@^3': '^3.1.8'
  'picomatch@^2': '^2.3.2'
  'picomatch@>=4.0.0 <4.0.4': '^4.0.4'
  'body-parser@^2': '^2.3.0'
  'proxy-addr@^2': '^2.0.8'
  'dompurify@^3': '^3.4.17'
  # Dev-tooling advisories (pnpm audit, 2026-10-13), pinned to the patched line within each major.
  'postcss@^8': '^8.5.23'
  'nanoid@^3': '^3.3.18'
  'lodash@^4': '^4.18.0'
  'browserslist@^4': '^4.28.7'
  '@babel/core@^7': '^7.29.6'
  'source-map-js@^1': '^1.2.2'
  'baseline-browser-mapping@^2': '^2.11.0'
  'postcss-selector-parser@^7': '^7.1.6'
  # @tailwindcss/typography pins 6.0.10 exactly; v7 is the first patched line.
  'postcss-selector-parser@6.0.10': '^7.1.6'
  # vitest resolved its own copy from an older lockfile entry.
  'vite@^7': '^7.3.5'
  '@esbuild-kit/esm-loader': npm:tsx@^4.21.0
  '@expo/ngrok-bin>@expo/ngrok-bin-darwin-arm64': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-darwin-x64': '-'
