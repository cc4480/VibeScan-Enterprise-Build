kind = "web"
previewPath = "/"
title = "VibeScan"
version = "1.0.0"
id = "artifacts/vibescan"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18425

[services.development]
run = "pnpm --filter @workspace/vibescan run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vibescan", "run", "build" ]

[services.production.run]
# vite preview serves the built output with the security headers configured in
# vite.config.ts preview.headers — the static file server has no header support.
args = ["pnpm", "--filter", "@workspace/vibescan", "run", "serve"]

[services.production.run.env]
PORT = "18425"
NODE_ENV = "production"

[services.env]
PORT = "18425"
BASE_PATH = "/"
