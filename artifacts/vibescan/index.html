      <h1>SecScan — black-box security scanning for vibe coders</h1>
      <p>Paste a URL for a web application you own or are authorised to test and get a plain-English security report, usually in under a minute — no installs, agents or code changes required. Every scan is a full scan; there are no tiers.</p>
      <p>Checks are aligned with the OWASP Top 10: security headers, TLS/HSTS, cookie flags, CORS misconfiguration, exposed secrets and config files, known-CVE component versions, Supabase/Firebase rules exposure, injection (reflected XSS, SQL injection, path traversal), and API surface discovery with missing-authentication, IDOR, BFLA and mass-assignment testing.</p>
      <p>Reports are generated by AI with a letter grade (A–F), a numeric risk score, and one universal fix prompt that works in Claude Code, Cursor, Codex, Copilot, Grok Build, Lovable, Bolt, Replit and any other AI coding tool. Every account gets 3 free scans every month. SecScan Unlimited ($19/month) gives unlimited full scans (fair use: up to 5 scans an hour and 20 a day per account) and watches up to 3 sites around the clock — hourly checks, grade-based rescans and hourly CVE matching.</p>

      <h2>What SecScan checks</h2>
      <ul>
        <li>Security headers and TLS: Content-Security-Policy, HSTS, X-Frame-Options, SSL/TLS grade, cookie flags, CORS.</li>
        <li>Exposed secrets: API keys for OpenAI, Anthropic, Stripe, AWS, GitHub and others found in your JavaScript, plus exposed .env, .git and backup files.</li>
        <li>AI-built app backends: Supabase row level security, Supabase and Firebase storage exposure, Firestore and Realtime Database rules.</li>
        <li>Injection and access control: SQL injection, cross-site scripting, template injection, path traversal, IDOR and broken object-level authorisation.</li>
        <li>APIs: OpenAPI and GraphQL exposure, GraphQL introspection, batching and IDEs, missing authentication, mass assignment.</li>
        <li>DNS and email: SPF, DKIM, DMARC, DNSSEC, subdomain takeover.</li>
        <li>Known vulnerabilities: outdated components matched to CVEs, with continuous monitoring and alerts.</li>
      </ul>
      <h2>Made for apps built with AI tools</h2>
      <p>SecScan scans sites made with Lovable, Bolt.new, Cursor, Claude Code, Replit, v0, Next.js, Supabase and Firebase, and writes fix prompts you can paste back into the tool you built with. It also runs as an MCP server for Claude Code and Cursor, and as a REST API, CLI and GitHub Action.</p>
